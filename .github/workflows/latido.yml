# GitHub pausa las tareas programadas de un repositorio que pasa 60 días sin cambios.
# Una vez por mes deja una marca en el repo para que la edición no se detenga.
name: Latido

on:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  latido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/latido
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latido
          git commit -m "Latido mensual para que la edición siga corriendo"
          git push
