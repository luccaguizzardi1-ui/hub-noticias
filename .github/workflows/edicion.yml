# Arma la edición cada 20 minutos, la cifra y la publica en GitHub Pages con la app.
#
# El cron de GitHub no alcanza: es "lo mejor que puede" y con carga saltea corridas sin avisar (el 23/10
# lanzó 3 de unas 40 y la edición quedó 5 horas quieta). El reloj es la propia edición:
# - el job "siguiente" espera en el entorno "reloj" (temporizador de 19 minutos del lado de GitHub: no
#   ocupa máquina ni cuenta como uso), completa los 20 minutos desde el comienzo y pide la próxima;
# - vigia.yml, cuando termina una edición, la pide si la cadena quedó cortada;
# - el cron y cada push de código quedan de respaldo para volver a arrancarla.
# Nunca hay dos cadenas: con el grupo de concurrencia, mientras una corrida trabaja sólo puede quedar
# otra en espera; un pedido nuevo cancela al que esperaba y sigue uno solo.
# Para frenar la edición: deshabilitar este workflow y cancelar la corrida en curso.
name: Edición

on:
  schedule:
    - cron: "7,27,47 * * * *"   # respaldo: lejos del minuto 0 que GitHub atrasa
  push:
    branches: [main]
    paths: [".github/workflows/edicion.yml", "motor/**", "app/**", "datos/**", "requirements.txt"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: edicion
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bajar la edición publicada (para reusar las notas que ya están)
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/edicion.cifrada.json" -o anterior.json || rm -f anterior.json
      - name: Armar y cifrar
        env:
          DIARIO_CLAVE: ${{ secrets.DIARIO_CLAVE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # sólo para elegir secciones
        run: python motor/publicar.py --salida _site --anterior anterior.json --avisos avisos.json
      - name: Guardar los avisos de último momento para después de publicar
        uses: actions/upload-artifact@v4
        with:
          name: avisos
          path: avisos.json
          retention-days: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: armar
    runs-on: ubuntu-latest
    timeout-minutes: 10   # sin tope serían 6 horas con el grupo tomado y sin ediciones
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4

  # Los avisos salen recién con la edición publicada: al tocar la notificación, la nota ya está.
  avisar:
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: avisos
      - name: Mandar los avisos al iPhone y al iPad
        env:
          VAPID_PRIVADA: ${{ secrets.VAPID_PRIVADA }}
          AVISOS_IPHONE: ${{ secrets.AVISOS_IPHONE }}
          AVISOS_IPAD: ${{ secrets.AVISOS_IPAD }}
        run: python motor/avisos.py --enviar avisos.json

  # La próxima edición, a los 20 minutos del comienzo de ésta. No depende de los otros jobs: la cadena
  # sigue aunque esta edición falle. La espera la hace el entorno "reloj" (19 minutos); el paso completa
  # lo que falte, así que si el entorno faltara o perdiera el temporizador, igual espera durmiendo.
  siguiente:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: reloj
      deployment: false
    permissions:
      actions: write   # pedir corridas con el token del repo (workflow_dispatch sí dispara)
      contents: read
      issues: write    # avisar por issue si la edición falla (las corridas encadenadas no mandan mail)
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RAMA: ${{ github.ref_name }}
    steps:
      - name: Completar los 20 minutos
        run: |
          inicio=$(timeout 60 gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_started_at || true)
          desde=$(date -d "${inicio:-now}" +%s 2>/dev/null || date +%s)
          espera=$(( 1200 - ($(date +%s) - desde) ))
          (( espera > 1200 )) && espera=1200
          if (( espera > 0 )); then echo "Faltan $espera s"; sleep "$espera"; fi

      - name: Pedir la próxima edición
        run: |
          for intento in 1 2 3 4 5 6 7 8; do
            timeout 60 gh workflow run edicion.yml --repo "$REPO" --ref "$RAMA" && { echo "Pedida."; exit 0; }
            echo "No se pudo pedir (intento $intento)"
            sleep $(( 20 * intento ))
          done
          echo "::error::No se pudo pedir la próxima edición: la retoman el vigía o el cron"
          exit 1

      - name: Avisar si la edición falla
        if: ${{ !cancelled() }}
        run: |
          fallas=$(timeout 60 gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.name != "siguiente" and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled"))] | length' || true)
          [ -z "$fallas" ] && exit 0   # sin respuesta de la API no se abre ni se cierra nada
          titulo="La edición está fallando"
          abierto=$(timeout 60 gh issue list --repo "$REPO" --state open --search "\"$titulo\" in:title" --json number --jq '.[0].number // empty')
          if [ "${fallas:-0}" != "0" ] && [ -z "$abierto" ]; then
            gh issue create --repo "$REPO" --title "$titulo" \
              --body "La edición falló en https://github.com/$REPO/actions/runs/$RUN_ID. La cadena sigue intentando cada 20 minutos; este aviso se cierra solo cuando una edición sale bien."
          elif [ "${fallas:-0}" = "0" ] && [ -n "$abierto" ]; then
            gh issue close "$abierto" --repo "$REPO" --comment "Volvió a salir bien: https://github.com/$REPO/actions/runs/$RUN_ID"
          fi

      - name: Latido si el repo lleva 30 días sin cambios
        if: ${{ !cancelled() }}
        run: |
          ultimo=$(timeout 60 gh api "repos/$REPO/commits?per_page=1" --jq '.[0].commit.committer.date' || true)
          if [ -n "$ultimo" ] && (( $(date +%s) - $(date -d "$ultimo" +%s) > 30 * 86400 )); then
            timeout 60 gh workflow run latido.yml --repo "$REPO" --ref "$RAMA" && echo "Pedí el latido."
          fi
