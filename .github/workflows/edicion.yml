# Arma la edición cada 20 minutos, la cifra y la publica en GitHub Pages con la app.
#
# El cron de GitHub no alcanza: es "lo mejor que puede" y con carga saltea corridas sin avisar (el 23/10
# lanzó 3 de unas 40 y la edición quedó 5 horas quieta). El reloj es la propia edición:
# - el job "siguiente" espera en el entorno "reloj" (temporizador de 19 minutos del lado de GitHub: no
#   ocupa máquina ni cuenta como uso), completa los 20 minutos y pide la próxima (.github/scripts/reloj.sh);
# - vigia.yml es una segunda cadena, con su propio entorno ("reloj-vigia"), que la cuida: si la de la
#   edición se corta, pide una edición; y cada edición pide un vigía si no hay ninguno vivo;
# - el cron y cada push de código quedan de respaldo para volver a arrancarlas.
# Nunca hay dos cadenas: con el grupo de concurrencia, mientras una corrida trabaja sólo puede quedar
# otra en espera; un pedido nuevo cancela al que esperaba y sigue uno solo.
# Para frenar todo: deshabilitar "Edición" y "Vigía" (las cadenas no piden un workflow deshabilitado a
# mano). No borrar ni editar los entornos "reloj" y "reloj-vigia": sin temporizador, cada paso
# "completar" igual sostiene los 20 minutos, pero borrar uno corta su cadena.
name: Edición

on:
  schedule:
    - cron: "7,27,47 * * * *"   # respaldo: lejos del minuto 0 que GitHub atrasa
  push:
    branches: [main]
    paths: [".github/workflows/edicion.yml", ".github/scripts/**", "motor/**", "app/**", "datos/**", "requirements.txt"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: edicion
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bajar la edición publicada (para reusar las notas que ya están)
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/edicion.cifrada.json" -o anterior.json || rm -f anterior.json
      - name: Armar y cifrar
        env:
          DIARIO_CLAVE: ${{ secrets.DIARIO_CLAVE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # sólo para elegir secciones
        run: python motor/publicar.py --salida _site --anterior anterior.json --avisos avisos.json
      - name: Guardar los avisos de último momento para después de publicar
        uses: actions/upload-artifact@v4
        with:
          name: avisos
          path: avisos.json
          retention-days: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: armar
    runs-on: ubuntu-latest
    timeout-minutes: 10   # sin tope serían 6 horas con el grupo tomado y sin ediciones
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4

  # Los avisos salen recién con la edición publicada: al tocar la notificación, la nota ya está.
  avisar:
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: avisos
      - name: Mandar los avisos al iPhone y al iPad
        env:
          VAPID_PRIVADA: ${{ secrets.VAPID_PRIVADA }}
          AVISOS_IPHONE: ${{ secrets.AVISOS_IPHONE }}
          AVISOS_IPAD: ${{ secrets.AVISOS_IPAD }}
        run: python motor/avisos.py --enviar avisos.json

  # Las corridas encadenadas las pide el bot: si fallan, GitHub no manda mail. Este job abre el issue
  # «La edición está fallando» (el issue sí llega por mail) y lo cierra cuando una edición sale bien.
  informe:
    needs: [armar, publicar, avisar]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      FALLO: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
    steps:
      - name: Abrir o cerrar el aviso de fallas
        run: |
          titulo="La edición está fallando"
          abierto=$(timeout 60 gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$titulo\")][0].number // empty") || exit 0
          if [ "$FALLO" = "true" ] && [ -z "$abierto" ]; then
            timeout 60 gh issue create --repo "$REPO" --title "$titulo" \
              --body "La edición falló en https://github.com/$REPO/actions/runs/$RUN_ID. La cadena sigue intentando cada 20 minutos; este aviso se cierra solo cuando una edición sale bien."
          elif [ "$FALLO" != "true" ] && [ -n "$abierto" ]; then
            timeout 60 gh issue close "$abierto" --repo "$REPO" --comment "Volvió a salir bien: https://github.com/$REPO/actions/runs/$RUN_ID"
          fi

  # La próxima edición, a los 20 minutos del comienzo de ésta. No depende de los otros jobs: la cadena
  # sigue aunque esta edición falle.
  siguiente:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # la espera del entorno no cuenta; los reintentos pueden llevar hasta una hora
    environment:
      name: reloj
      deployment: false
    permissions:
      actions: write   # pedir corridas con el token del repo (workflow_dispatch sí dispara)
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RAMA: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Completar los 20 minutos
        run: bash .github/scripts/reloj.sh completar
      - name: Pedir la próxima edición
        run: bash .github/scripts/reloj.sh pedir edicion.yml 60
      - name: Que el vigía siga vivo
        if: ${{ !cancelled() }}
        run: |
          if [ "$(bash .github/scripts/reloj.sh vivas vigia.yml)" = "0" ]; then
            bash .github/scripts/reloj.sh pedir vigia.yml 10 || echo "::warning::No pude pedir el vigía: lo intenta la próxima edición"
          else
            echo "El vigía está vivo."
          fi
      - name: Latido si el repo lleva 30 días sin cambios
        if: ${{ !cancelled() }}
        run: bash .github/scripts/reloj.sh latido
