# Vigía de la edición: una segunda cadena, independiente de la de "Edición", que la cuida.
# Cada corrida espera en su entorno "reloj-vigia" (19 minutos del lado de GitHub, sin máquina), completa
# los 20, revisa la edición y pide la próxima vigilancia (.github/scripts/reloj.sh). Si la cadena de la
# edición se cortó, pide una edición; si una corrida quedó trabada, la cancela. A su vez, cada edición
# pide un vigía si no hay ninguno vivo. Para que se corten las dos a la vez tiene que fallar GitHub por
# más de una hora (cada pedido reintenta durante una hora), y ahí quedan el cron y el push.
# (workflow_run no sirve: no se dispara con corridas pedidas por el token del repo; probado el 23/10.)
# Para frenar todo: deshabilitar "Edición" y "Vigía". No borrar ni editar los entornos.
name: Vigía

on:
  schedule:
    - cron: "17,37,57 * * * *"   # respaldo, como en Edición
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: reloj-vigia
      deployment: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RAMA: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Completar los 20 minutos
        run: bash .github/scripts/reloj.sh completar
      - name: Revisar la edición
        run: bash .github/scripts/reloj.sh revisar
      - name: Pedir la próxima vigilancia
        if: ${{ !cancelled() }}
        run: bash .github/scripts/reloj.sh pedir vigia.yml 60
